name: Adicionar evolução anual dos aportes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-rent-investment-timeline.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Aplicar linha do tempo de aportes
        run: python scripts/add-rent-investment-timeline.py
      - name: Salvar alteração no site
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculadora/index.html
          git commit -m "Adicionar evolução anual dos aportes"
          git push

# disparo inicial da atualização
