name: Atualizar comparativo INCC e salário em reais

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-incc-salary-history.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Atualizar comparativo monetário
        run: python scripts/add-incc-salary-history.py
      - name: Salvar alteração
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculadora/index.html calculadora/service-worker.js
          git commit -m "Mostrar INCC e salário em valores reais"
          git push
