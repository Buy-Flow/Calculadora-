name: Atualizar comparativo INCC e legibilidade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-incc-salary-history.yml'
      - 'scripts/add-incc-salary-history.py'
      - 'scripts/refine-incc-table.py'
      - 'scripts/improve-readability.py'
      - 'scripts/add-floating-navigation.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages-incc
  cancel-in-progress: true

jobs:
  patch:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar comparativo para cliente e mobile
        run: python scripts/add-incc-salary-history.py

      - name: Refinar design da tabela e mostrar quem subiu mais
        run: python scripts/refine-incc-table.py

      - name: Aumentar legibilidade geral e reduzir microtexto
        run: python scripts/improve-readability.py

      - name: Adicionar menu flutuante de navegação
        run: python scripts/add-floating-navigation.py

      - name: Salvar alteração
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração de conteúdo necessária."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add calculadora/index.html calculadora/service-worker.js
            git commit -m "Adicionar menu flutuante de navegação"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar versão atualizada
        id: deployment
        uses: actions/deploy-pages@v4
