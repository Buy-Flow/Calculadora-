name: Adicionar comparativo INCC e salário mínimo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-incc-salary-history.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Adicionar comparativo
        run: python scripts/add-incc-salary-history.py
      - name: Salvar alteração
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculadora/index.html
          git commit -m "Adicionar comparativo INCC e salário mínimo"
          git push
