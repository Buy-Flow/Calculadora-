name: Ativar app instalável

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-pwa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Ativar PWA no index
        run: python scripts/enable-pwa.py
      - name: Salvar alteração
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculadora/index.html
          git commit -m "Transformar calculadora em app instalável"
          git push
